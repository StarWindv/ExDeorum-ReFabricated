plugins {
    id 'java-library'
    id 'net.fabricmc.fabric-loom' version '1.18.2'
}

version = '5.1.5'
group = 'top.starwindv.exdeorum'
base {
    archivesName = 'exdeorum'
}

// Compiled with a newer local JDK against the Java 25 class file version MC 26.2 requires
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

loom {
    accessWidenerPath = file('src/main/resources/exdeorum.accesswidener')

    mods {
        "exdeorum" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
        }

        server {
            server()
            runDir 'run/server'
            programArg '--nogui'
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Exclude compat packages for libraries without 26.2 support yet,
// and the datagen sources which depend on the NeoForge-only ModKit library
sourceSets.main.java.exclude(
    '**/compat/emi/**',
    '**/compat/jade/**',
    '**/compat/kubejs/**',
    '**/compat/top/**',
    '**/data/**'
)

repositories {
    mavenCentral()
    maven {
        name = 'jei'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup "mezz.jei"
            includeGroup "net.mezzdev.config"
        }
    }
    maven {
        name = 'modmenu'
        url = 'https://maven.terraformersmc.com/'
        content {
            includeGroup "com.terraformersmc"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Loom 1.6+ remaps mixins during remapJar, so the legacy Mixin annotation processor
    // (which cannot handle Mojang official mappings) is not used here.
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // JEI OPTIONAL
    compileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"

    // ModMenu OPTIONAL, only for the drop rate config screen entry point
    compileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    localRuntime "com.terraformersmc:modmenu:${modmenu_version}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            version: version
    ]
    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

